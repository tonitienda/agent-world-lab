services:
  minecraft:
    image: itzg/minecraft-server:java21
    ports:
      - "127.0.0.1:25565:25565"
    environment:
      EULA: "${EULA:-FALSE}"
      TYPE: VANILLA
      VERSION: "${MC_VERSION:-1.21.4}"
      MEMORY: "${MC_MEMORY:-3G}"
      ONLINE_MODE: "FALSE"
      MODE: survival
      DIFFICULTY: peaceful
      PVP: "false"
      ENABLE_RCON: "false"
      ENABLE_COMMAND_BLOCK: "false"
      SPAWN_PROTECTION: "0"
      MAX_PLAYERS: "8"
      MOTD: "Agent World Lab - local experiment only"
    volumes:
      - ./data/minecraft:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
