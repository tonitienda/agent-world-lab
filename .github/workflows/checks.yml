name: Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Validate Docker Compose
        run: docker compose config -q

  minecraft-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EULA: 'TRUE'
      MC_VERSION: '1.21.4'
      MC_MEMORY: '2G'
      MC_LEVEL_TYPE: 'minecraft:flat'
      MC_HOST: '127.0.0.1'
      MC_PORT: '25565'
      AGENT_ID: 'ci-explorer'
      AWL_DISPOSABLE_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Start isolated Minecraft Java server
        # Create the bind-mount folder first so Docker does not make data/ root-owned.
        run: |
          mkdir -p data/minecraft
          docker compose up -d --wait --wait-timeout 300 minecraft
      - name: Test real Mineflayer session and in-world actions
        run: npm run integration
      - name: Test movement, mining and placing in the world
        run: npm run bot-smoke
      - name: Test disposable ravine course and crossing
        run: npm run integration:ravine
      - name: Test disposable survival actions and generated presets
        run: npm run integration:survival
      - name: Show Minecraft logs on failure
        if: failure()
        run: docker compose logs --tail=250 minecraft
      - name: Stop Minecraft and remove ephemeral containers
        if: always()
        run: docker compose down --volumes

  minecraft-video:
    runs-on: ubuntu-latest
    # Package mirrors can be slow; don't cancel before recorder validation starts.
    timeout-minutes: 45
    env:
      EULA: 'TRUE'
      MC_VERSION: '1.21.4'
      MC_MEMORY: '2G'
      MC_LEVEL_TYPE: 'minecraft:flat'
      # Viewer regression experiment: default superflat ground is below Y=0.
      # 1 bedrock + 70 stone + 2 dirt + 1 grass => ground surface Y=9.
      GENERATOR_SETTINGS: '{"biome":"minecraft:plains","layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:stone","height":70},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}]}'
      MC_HOST: '127.0.0.1'
      MC_PORT: '25565'
      AGENT_ID: 'ci-camera-test'
      RECORD_FRAMES: '240'
      RECORD_WIDTH: '854'
      RECORD_HEIGHT: '480'
      LIBGL_ALWAYS_SOFTWARE: '1'
      RECORD_DEBUG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless graphics and video tooling
        run: |
          # Use runner-provided tools where possible and avoid pulling large
          # recommended packages (not needed for headless capture).
          sudo apt-get update -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends -o Acquire::Retries=3 xvfb ffmpeg libgl1-mesa-dri libgbm1 libasound2t64 libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev pkg-config libxi-dev libxext-dev libgl1-mesa-dev xserver-xorg-dev
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install isolated browser recorder
        run: |
          npm install --prefix packages/minecraft-recorder --no-audit --no-fund
          npx --prefix packages/minecraft-recorder playwright install --with-deps chromium
      - name: Validate isolated recorder lifecycle and terrain cameras
        run: npm run integration:recorder
      - name: Start isolated Minecraft world
        # Create the bind-mount folder first so Docker does not make data/ root-owned.
        run: |
          mkdir -p data/minecraft
          docker compose up -d --wait --wait-timeout 300 minecraft
      - name: Record bot movement
        timeout-minutes: 3
        env:
          CAPTURE_OUTPUT_DIR: ${{ runner.temp }}/minecraft-captures
        run: |
          echo "DISPLAY=${DISPLAY:-unset}"; ffmpeg -version | head -n 2
          npm run capture-smoke
      - name: Validate recorded MP4 with ffprobe
        run: |
          set -euo pipefail
          folder=$(find "$RUNNER_TEMP/minecraft-captures" -name metadata.json -type f -printf '%h' -quit)
          test -n "$folder"
          for camera in agent-pov observer follow; do
            video="$folder/$camera.mp4"
            test -s "$video"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,nb_frames -of json "$video"
            ffmpeg -v error -xerror -i "$video" -frames:v 1 -f null -
            python3 scripts/check-video.py "$video"
          done
      - name: Upload video and session events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-video-${{ github.run_id }}
          path: ${{ runner.temp }}/minecraft-captures/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
      - name: Minecraft logs on failure
        if: failure()
        run: docker compose logs --tail=200 minecraft
      - name: Stop disposable server
        if: always()
        run: docker compose down --volumes
